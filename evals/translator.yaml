# Translator eval cases. Format and results: ../skills/CONTRACT.md
#
# Each case is an exact request, as the resolver hands it over, and one expected result:
#   commands:    the commands, in order (written without "npx" and "--json": both are ignored when comparing)
#   unsupported: what has no command
#   unclear:     what the request is missing
#
# Run by hand: give a subagent the translator skill and the request only, ask it to answer with --dry-run, and
# compare its commands with the expected ones by flag and value (order and quoting don't matter).
#
# Ids are written from src/, with these files:
#   features/homepage/components/<Name>/<Name>.tsx
#   features/homepage/views/SearchView/SearchView.tsx
# Source: "plan" = apps/advise/reactsmith-plan.md (real commands of the advise build), "added" = written for coverage.

# ── Components ────────────────────────────────────────────────────────────

- id: component-create-with-root-props
  source: plan §2
  request: >-
    Create the EditSearchButton component in the homepage feature, with the prop onClick?: () => void.
    Its root is a button with type='button' and onClick={onClick}, laying out its children in a row with gap 3,
    centered.
  expect:
    commands:
      - >-
        component create EditSearchButton --feature homepage --interface "onClick?: () => void" --root button --root-props "type='button' onClick={onClick}" --direction row --gap 3 --align center
  note: >-
    a button root is already a row (checked), so the plan left --direction row out. Accept both.

- id: component-create-layout-only
  source: plan §3
  request: >-
    Create ResultsHeading in the homepage feature with the prop loading: boolean, as a row with its children
    spaced between and centered.
  expect:
    commands:
      - >-
        component create ResultsHeading --feature homepage --interface "loading: boolean" --direction row --justify between --align center

- id: component-create-article-root
  source: plan §4
  request: >-
    Create ProductCard in the homepage feature with props image: string, title: string, maker: string,
    reason: string, price: string, sellers: number. Its root is an article, laid out as a column.
  expect:
    commands:
      - >-
        component create ProductCard --feature homepage --interface "image: string; title: string; maker: string; reason: string; price: string; sellers: number" --root article --direction column

- id: component-move-to-shared
