- id: unsupported-jsx-prop
  source: plan §7
  request: >-
    In features/homepage/views/SearchView/SearchView.tsx#search, pass endIcon={<EditSearchButton onClick={editSearch} />}.
  expect:
    unsupported: >-
      --props takes literals or variables, not JSX
  note: >-
    checked, element update refuses it (value-expression-not-allowed). Its hint (compute it in a variable first) needs a hand edit, so the result stays unsupported.

